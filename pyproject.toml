[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillflow-agent"
version = "0.1.0"
description = "A modular after-sales task agent derived from CoreCoder"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Yufeng He", email = "40085740+he-yufeng@users.noreply.github.com" },
]
keywords = ["agent", "langgraph", "tool-calling", "mcp", "after-sales"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "pydantic>=2.6,<3",
  "httpx>=0.27,<1",
  # 生产 OIDC 回调需要验证 ID Token 的非对称签名；演示模式不发起登录。
  "PyJWT[crypto]>=2.8,<3",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  # 本轮中断处理使用 NodeCancelledError，最低版本与已验收运行环境保持一致。
  "langgraph>=1.2.14,<2",
  # S4 实际 Saver 的版本与本机检查点/interrupt 故障回归保持一致。
  "langgraph-checkpoint-sqlite>=3.1.2,<4",
  "aiosqlite>=0.21,<1",
  # S5 已核对的官方 SDK 与 LangChain Adapter 组合，固定版本防止协议适配漂移。
  "mcp==1.30.0",
  "langchain-mcp-adapters==0.3.2",
  # 质量事件、商品与订单由项目 B 自有 SQLite 业务仓库管理；每个并发任务独立会话。
  "SQLAlchemy>=2.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["corecoder", "skillflow"]

[project.optional-dependencies]
litellm = ["litellm>=1.60.0,<2.0.0"]
dev = ["pytest>=7.0", "ruff>=0.9.0"]

[project.scripts]
corecoder = "corecoder.cli:main"

[project.urls]
Homepage = "https://github.com/2806liu/skillflow-agent"
Repository = "https://github.com/2806liu/skillflow-agent"
Issues = "https://github.com/2806liu/skillflow-agent/issues"

[tool.ruff]
line-length = 130
target-version = "py310"
